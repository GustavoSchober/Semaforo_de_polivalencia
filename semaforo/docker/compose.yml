# Dois contêineres: o Postgres e a aplicação. Nenhum publica porta para fora
# do host — a aplicação escuta só em 127.0.0.1:3200, e quem a expõe é o
# Tailscale (`tailscale funnel`), que cuida do TLS. A Vercel empresta o
# domínio e repassa os pedidos para o endereço do Funnel (ver next.config.ts).
#
# O Postgres não é alcançável de fora do host — metade da segurança do
# sistema, e é de graça.

name: semaforo

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: semaforo
      POSTGRES_USER: semaforo_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # sem "ports": o banco não é alcançável de fora
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semaforo_app -d semaforo']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: run
      args:
        DOMINIOS_PUBLICOS: ${DOMINIOS_PUBLICOS:-}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      TZ: America/Sao_Paulo
    secrets:
      - database_url
    ports:
      - '127.0.0.1:3200:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        # sem rotação, o disco enche por causa de log antes de encher por dado
        max-size: '10m'
        max-file: '5'

  # Só roda sob demanda: `docker compose run --rm migrador`
  migrador:
    profiles: ['ferramentas']
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrador
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url

volumes:
  pgdata:
